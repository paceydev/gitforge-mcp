name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag must match Cargo.toml version')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify archive set and generate checksums
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          targets = {
              'aarch64-apple-darwin': 'zip',
              'x86_64-apple-darwin': 'zip',
              'aarch64-unknown-linux-gnu': 'tar.gz',
              'x86_64-unknown-linux-gnu': 'tar.gz',
              'aarch64-pc-windows-msvc': 'zip',
              'x86_64-pc-windows-msvc': 'zip',
          }
          expected = {'gitforge-mcp-' + version + '-' + target + '.' + extension for target, extension in targets.items()}
          archives = sorted(pathlib.Path('dist').iterdir())
          if {p.name for p in archives} != expected:
              raise SystemExit('Release must contain exactly the six tested native archives')
          sums = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in archives)
          pathlib.Path('dist/SHA256SUMS').write_text(sums)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION" dist/attestation.json
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ['RELEASE_TAG']
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          heading = '## [' + tag.removeprefix('v') + ']'
          section = changelog.split(heading, 1)[1].split('\n## [', 1)[0]
          notes = '\n'.join(section.splitlines()[1:]).strip()
          notes += '\n\nBinaries are unsigned. Each archive has SHA-256 checksums and GitHub build provenance.\n'
          notes += '\nVerify an archive with `gh attestation verify <archive> --repo ' + os.environ['GH_REPO'] + '`.\n'
          pathlib.Path('/tmp/release-notes.md').write_text(notes)
          PY
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            python3 -c "import json; assert json.load(open('/tmp/release-state.json'))['isDraft'], 'Release is already published'"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
